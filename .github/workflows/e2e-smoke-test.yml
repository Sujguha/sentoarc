name: E2E smoke test (auth)

# One-off, manually-triggered: exercises sign-up against the live
# deployment to confirm better-auth + SendGrid + D1 + the session cookie
# all actually work together end to end. Does not touch any secrets in
# its own config; the password is generated at runtime and never stored.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email to sign up with (use a +alias you control)"
        required: true
        default: "sujoy.guha2+test@gmail.com"
      base_url:
        description: "Deployed app base URL"
        required: true
        default: "https://sentoarc.sujoy-guha2.workers.dev"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sign up (with live Worker logs captured around the request)
        env:
          INPUT_EMAIL: ${{ inputs.email }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Unique email per run so repeated runs don't collide with an
          # already-registered address from a prior successful run.
          LOCAL_PART="${INPUT_EMAIL%@*}"
          DOMAIN_PART="${INPUT_EMAIL#*@}"
          TEST_EMAIL="${LOCAL_PART}-$(date +%s)@${DOMAIN_PART}"
          echo "test_email=$TEST_EMAIL" >> "$GITHUB_OUTPUT"

          PASSWORD="Test-$(openssl rand -hex 8)!A1"
          npx wrangler tail sentoarc --format pretty > tail.log 2>&1 &
          TAIL_PID=$!
          sleep 6

          echo "Signing up $TEST_EMAIL against ${{ inputs.base_url }}"
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -c cookies.txt \
            -X POST "${{ inputs.base_url }}/api/auth/sign-up/email" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"Smoke Test\",\"email\":\"$TEST_EMAIL\",\"password\":\"$PASSWORD\"}")
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat response.json
          echo ""

          sleep 6
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "----- wrangler tail output -----"
          cat tail.log

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sign-up failed with status $HTTP_CODE"
            exit 1
          fi
          if grep -q "(error)" tail.log; then
            echo "::error::Worker logged an error during sign-up (see tail output above) — most likely the verification email failed to send"
            exit 1
          fi
          echo "Sign-up succeeded and no server-side errors were logged — verification email should be in the inbox for $TEST_EMAIL"

      - name: Confirm no session before email verification (expected 401)
        run: |
          # requireEmailVerification is on, so better-auth correctly issues
          # no session until the email link is clicked — a 401 here is the
          # CORRECT outcome, not a failure.
          HTTP_CODE=$(curl -s -o usage.json -w "%{http_code}" -b cookies.txt \
            "${{ inputs.base_url }}/api/usage")
          echo "HTTP status: $HTTP_CODE (expected 401 pre-verification)"
          cat usage.json
          echo ""
          if [ "$HTTP_CODE" != "401" ]; then
            echo "::error::Expected 401 (no session pre-verification) but got $HTTP_CODE — session/verification gating may be broken"
            exit 1
          fi

      - name: Health check
        run: |
          curl -sf "${{ inputs.base_url }}/api/health" | tee health.json
          echo ""
