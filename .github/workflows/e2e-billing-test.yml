name: E2E billing test (Stripe Checkout/Portal/webhook liveness)

# One-off, manually-triggered: confirms the Stripe integration actually
# works against the live deployment -- that Checkout session creation
# succeeds with the provisioned price IDs and real secret key, that the
# Billing Portal correctly refuses a user with no Stripe customer yet,
# and that the webhook endpoint is live and signature-checking (without
# needing the real webhook secret, which this workflow never has access
# to -- it was pushed straight from provision-stripe.yml to Cloudflare).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed app base URL"
        required: true
        default: "https://sentoarc.sujoy-guha2.workers.dev"

jobs:
  billing-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sign up and verify a test account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TEST_EMAIL="sujoy.guha2+billing-$(date +%s)@gmail.com"
          PASSWORD="Test-$(openssl rand -hex 8)!A1"
          echo "TEST_EMAIL=$TEST_EMAIL" >> "$GITHUB_ENV"

          curl -s -o /dev/null -w "signup: %{http_code}\n" \
            -X POST "${{ inputs.base_url }}/api/auth/sign-up/email" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"Billing Test\",\"email\":\"$TEST_EMAIL\",\"password\":\"$PASSWORD\"}"

          npx wrangler d1 execute sentoarc-db --remote \
            --command "UPDATE user SET email_verified = 1 WHERE email = '$TEST_EMAIL'"

          curl -s -o /dev/null -w "signin: %{http_code}\n" -c cookies.txt \
            -X POST "${{ inputs.base_url }}/api/auth/sign-in/email" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$PASSWORD\"}"

      - name: POST /api/billing/checkout -- expect a real Stripe Checkout URL
        run: |
          HTTP_CODE=$(curl -s -o checkout.json -w "%{http_code}" -b cookies.txt \
            -X POST "${{ inputs.base_url }}/api/billing/checkout" \
            -H "Content-Type: application/json" \
            -d '{"interval":"month"}')
          echo "HTTP status: $HTTP_CODE"
          cat checkout.json
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Expected 200, got $HTTP_CODE"
            exit 1
          fi
          URL=$(jq -r .url checkout.json)
          case "$URL" in
            https://checkout.stripe.com/*) echo "Got a real Checkout URL: $URL" ;;
            *) echo "::error::Response did not contain a checkout.stripe.com URL: $URL"; exit 1 ;;
          esac

      - name: POST /api/billing/portal -- expect 400 (no Stripe customer yet)
        run: |
          # This test account never completed Checkout, so it has no
          # stripeCustomerId on its subscription row -- the portal route
          # should refuse cleanly rather than erroring.
          HTTP_CODE=$(curl -s -o portal.json -w "%{http_code}" -b cookies.txt \
            -X POST "${{ inputs.base_url }}/api/billing/portal")
          echo "HTTP status: $HTTP_CODE (expected 400)"
          cat portal.json
          echo ""
          if [ "$HTTP_CODE" != "400" ]; then
            echo "::error::Expected 400 (no_stripe_customer), got $HTTP_CODE"
            exit 1
          fi

      - name: POST /api/billing/webhook with no signature -- expect 400 (route is live)
        run: |
          HTTP_CODE=$(curl -s -o webhook.json -w "%{http_code}" \
            -X POST "${{ inputs.base_url }}/api/billing/webhook" \
            -H "Content-Type: application/json" \
            -d '{"type":"test"}')
          echo "HTTP status: $HTTP_CODE (expected 400)"
          cat webhook.json
          echo ""
          if [ "$HTTP_CODE" != "400" ]; then
            echo "::error::Expected 400 (missing_signature), got $HTTP_CODE"
            exit 1
          fi

      - name: Clean up test user
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${TEST_EMAIL:-}" ]; then
            npx wrangler d1 execute sentoarc-db --remote \
              --command "DELETE FROM job WHERE created_by_user_id IN (SELECT id FROM user WHERE email = '$TEST_EMAIL')" || true
            npx wrangler d1 execute sentoarc-db --remote \
              --command "DELETE FROM subscription WHERE owner_id IN (SELECT id FROM user WHERE email = '$TEST_EMAIL')" || true
            npx wrangler d1 execute sentoarc-db --remote \
              --command "DELETE FROM session WHERE user_id IN (SELECT id FROM user WHERE email = '$TEST_EMAIL')" || true
            npx wrangler d1 execute sentoarc-db --remote \
              --command "DELETE FROM account WHERE user_id IN (SELECT id FROM user WHERE email = '$TEST_EMAIL')" || true
            npx wrangler d1 execute sentoarc-db --remote \
              --command "DELETE FROM user WHERE email = '$TEST_EMAIL'" || true
          fi
