name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sentoarc-db --remote
        env:
          # SENTOARCPROD: a separate Cloudflare API token from whatever
          # else CLOUDFLARE_API_TOKEN may have been used for elsewhere --
          # wrangler itself still expects the env var named
          # CLOUDFLARE_API_TOKEN, only the GitHub secret it's sourced
          # from changed.
          CLOUDFLARE_API_TOKEN: ${{ secrets.SENTOARCPROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SENTOARCPROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
