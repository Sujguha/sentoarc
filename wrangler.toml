name = "sentoarc"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sentoarc-db"
database_id = "67e4b297-1e67-471e-aa43-85321cdd47f5"

[[r2_buckets]]
binding = "PACKAGES_BUCKET"
bucket_name = "sentoarc-packages"
jurisdiction = "eu"

[[queues.producers]]
binding = "PACKAGE_QUEUE"
queue = "sentoarc-package-processing"

[[queues.consumers]]
queue = "sentoarc-package-processing"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "sentoarc-package-processing-dlq"

[triggers]
# hourly: retention purge + abandoned-upload-reservation sweep
crons = ["0 * * * *"]

[vars]
FREE_UPLOAD_LIMIT = "5"
# Matches WalkMe Learning Arc's own documented limits: 200MB standard
# document/asset upload, 500MB for video. (Learning Arc also caps video
# at 60 minutes; we don't parse video duration, so that half of the
# limit isn't enforced here -- only the byte size is.)
MAX_PACKAGE_SIZE_BYTES = "209715200"
MAX_VIDEO_SIZE_BYTES = "524288000"
FREE_RETENTION_HOURS = "24"
PRO_RETENTION_DAYS = "30"
ADMIN_EMAILS = "sujoy.guha2@gmail.com"
APP_BASE_URL = "https://sentoarc.sujoy-guha2.workers.dev"
SENDGRID_FROM_EMAIL = "sujoy.guha2@gmail.com"
SENDGRID_FROM_NAME = "SENtoArc"
# Pro pricing: EUR 19/month, EUR 190/year (Stripe Sandbox). Not secret:
# Stripe price IDs carry no account access on their own, only the
# secret key does.
STRIPE_PRICE_ID_MONTHLY = "price_1UNV3hCvTE3LMxwL7Lfq9VnM"
STRIPE_PRICE_ID_YEARLY = "price_1UNV3iCvTE3LMxwLnfl8hPTt"
# Pay-as-you-go: prepaid balance, not a Stripe subscription -- topped up
# via a one-time Checkout payment for whatever amount the customer picks
# (no pre-created Stripe Price needed), deducted per upload before
# processing starts. This is the price per MB processed, in cents.
METERED_UNIT_PRICE_CENTS = "1"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   BETTER_AUTH_SECRET
#   SENDGRID_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
