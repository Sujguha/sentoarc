name = "sentoarc"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sentoarc-db"
database_id = "67e4b297-1e67-471e-aa43-85321cdd47f5"

[[r2_buckets]]
binding = "PACKAGES_BUCKET"
bucket_name = "sentoarc-packages"
jurisdiction = "eu"

[[queues.producers]]
binding = "PACKAGE_QUEUE"
queue = "sentoarc-package-processing"

[[queues.consumers]]
queue = "sentoarc-package-processing"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "sentoarc-package-processing-dlq"

[limits]
# Belt-and-suspenders alongside the streaming rewrite in zip-utils.ts --
# that rewrite is what actually fixed the CPU/memory failures measured in
# the perf-test workflow, this just adds margin for the one entry
# (imsmanifest.xml) that's still genuinely decompressed+recompressed.
cpu_ms = 30000

[triggers]
# hourly: retention purge + abandoned-upload-reservation sweep
crons = ["0 * * * *"]

[vars]
FREE_UPLOAD_LIMIT = "5"
MAX_PACKAGE_SIZE_BYTES = "104857600"
FREE_RETENTION_HOURS = "24"
PRO_RETENTION_DAYS = "30"
ADMIN_EMAILS = "sujoy.guha2@gmail.com"
APP_BASE_URL = "https://sentoarc.sujoy-guha2.workers.dev"
SENDGRID_FROM_EMAIL = "sujoy.guha2@gmail.com"
SENDGRID_FROM_NAME = "SENtoArc"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   BETTER_AUTH_SECRET
#   SENDGRID_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
