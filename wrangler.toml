name = "sentoarc"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare-managed Custom Domain: DNS + SSL cert are provisioned and
# kept in sync automatically, no manual CNAME/A record needed -- the
# zone just has to be Active in Cloudflare first (it is).
[[routes]]
pattern = "sentoarc.de"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "sentoarc-db"
database_id = "67e4b297-1e67-471e-aa43-85321cdd47f5"

[[r2_buckets]]
binding = "PACKAGES_BUCKET"
bucket_name = "sentoarc-packages"
jurisdiction = "eu"

[[queues.producers]]
binding = "PACKAGE_QUEUE"
queue = "sentoarc-package-processing"

[[queues.consumers]]
queue = "sentoarc-package-processing"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "sentoarc-package-processing-dlq"

[triggers]
# hourly: retention purge + abandoned-upload-reservation sweep
crons = ["0 * * * *"]

[vars]
# Lifetime, not monthly -- matches the "3 objects (1 group / 3 files)"
# free tier on the pricing page. See migration 0009's `objects_remaining`
# default, which this is meant to match for a fresh signup.
FREE_OBJECT_LIMIT = "3"
# Matches WalkMe Learning Arc's own documented limits: 200MB standard
# document/asset upload, 500MB for video. (Learning Arc also caps video
# at 60 minutes; we don't parse video duration, so that half of the
# limit isn't enforced here -- only the byte size is.)
MAX_PACKAGE_SIZE_BYTES = "209715200"
MAX_VIDEO_SIZE_BYTES = "524288000"
FREE_RETENTION_HOURS = "24"
PRO_RETENTION_DAYS = "30"
ADMIN_EMAILS = "sujoy.guha2@gmail.com"
# Canonical URL -- used in email links (verification, magic-link,
# invitations), Stripe Checkout success/cancel redirects, and
# better-auth's trustedOrigins. The workers.dev URL still works for
# serving the app (nothing removes that), just not as the identity
# this app presents to users or external services anymore.
APP_BASE_URL = "https://sentoarc.de"
SENDGRID_FROM_EMAIL = "no-reply@sentoarc.de"
SENDGRID_FROM_NAME = "SENtoArc"
# One-time packs (Stripe Sandbox), self-serve via Checkout -- no
# subscriptions, no pre-created Stripe Prices (inline price_data at
# checkout time instead, same as the old pay-as-you-go top-up did).
PROJECT_PACK_PRICE_CENTS = "49900"
PROJECT_PACK_OBJECTS = "100"
ENTERPRISE_PACK_PRICE_CENTS = "199900"
# Soft launch (2026-10-10): Free only. Flip to "true" once the Stripe
# webhook delivery issue is confirmed fixed -- see PAID_PLANS_ENABLED
# in src/types/env.d.ts.
PAID_PLANS_ENABLED = "false"
# Cloudflare Turnstile on sign-up / sign-in / magic-link request --
# widget created, TURNSTILE_SECRET_KEY set via the dashboard. See
# src/lib/auth/index.ts.
TURNSTILE_ENABLED = "true"
TURNSTILE_SITE_KEY = "0x4AAAAAAFUVhBI1ddEECbqZ"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   BETTER_AUTH_SECRET
#   SENDGRID_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   TURNSTILE_SECRET_KEY
